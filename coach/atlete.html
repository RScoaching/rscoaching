<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlete Fiorentina · RS Coaching</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'%3E%3Crect width='36' height='36' rx='8' fill='%230E0B11'/%3E%3Crect x='9' y='20' width='4.2' height='7' rx='2.1' fill='%23FF8A57'/%3E%3Crect x='15.9' y='13' width='4.2' height='14' rx='2.1' fill='%23FF7A3D'/%3E%3Crect x='22.8' y='8' width='4.2' height='19' rx='2.1' fill='%23FF6A2E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   RS Coaching · Atlete Fiorentina
   Rosa U19W: ruolo per atleta (override locali), stat stagione,
   deep-link al carico atleta. Stesso design system del carico.
   ============================================================ */
:root{
  --bg:      oklch(8.5% 0.014 38);
  --surface: oklch(12%  0.016 38);
  --surface2:oklch(15%  0.018 38);
  --surface3:oklch(18%  0.020 38);
  --orange:  oklch(68% 0.19 42);
  --orange2: oklch(74% 0.15 50);
  --primary: oklch(68% 0.19 42);
  --violet:  oklch(62% 0.22 280);
  --violet2: oklch(68% 0.18 285);
  --violet-bg: oklch(62% 0.22 280 / 0.10);
  --violet-border: oklch(62% 0.22 280 / 0.22);
  --ember-bg: oklch(68% 0.19 42 / 0.10);
  --ember-border: oklch(68% 0.19 42 / 0.24);
  --text:    oklch(78% 0.012 38);
  --ink:     oklch(93% 0.010 38);
  --muted:   oklch(58% 0.014 38);
  --faint:   oklch(46% 0.014 38);
  --green:   oklch(70% 0.18 152);
  --red:     oklch(62% 0.22 25);
  --border:  oklch(22% 0.016 38 / 0.70);
  --border2: oklch(28% 0.018 38 / 0.80);
  --border3: oklch(36% 0.020 38 / 0.90);
  --shadow-sm:   0 1px 4px oklch(0% 0 0 / 0.45);
  --shadow-card: 0 4px 20px oklch(0% 0 0 / 0.45), 0 1px 3px oklch(0% 0 0 / 0.55);
  --shadow-md:   0 12px 40px oklch(0% 0 0 / 0.60);
  --shadow-btn:  0 4px 18px oklch(68% 0.19 42 / 0.35);
  --r-sm: 8px; --r: 12px; --r-lg: 16px;
  --ease: cubic-bezier(0.23, 1, 0.32, 1);
  --z-nav: 40; --z-sheet: 70; --z-toast: 90;
}
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  background: var(--bg);
  color: var(--text);
  font-family:'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
  min-height:100dvh;
}
body::before{
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(60% 45% at 82% -5%, oklch(68% 0.19 42 / 0.10), transparent 60%),
    radial-gradient(55% 40% at -8% 8%, oklch(62% 0.22 280 / 0.08), transparent 62%);
}
a{ color:inherit; text-decoration:none; }
:focus-visible{ outline:2px solid var(--orange); outline-offset:2px; border-radius:4px; }
.tnum{ font-variant-numeric: tabular-nums; font-feature-settings:"tnum" 1; }

/* ---------- layout shell ---------- */
.app{ display:flex; min-height:100dvh; position:relative; z-index:1; }
.main{ flex:1 1 auto; min-width:0; padding:0 0 64px; }
.topbar{
  position:sticky; top:0; z-index:var(--z-nav);
  display:flex; align-items:center; gap:14px;
  padding:16px 28px; background:oklch(8.5% 0.014 38 / 0.82);
  backdrop-filter:saturate(160%) blur(12px); border-bottom:1px solid var(--border);
}
.crest{ width:42px; height:42px; flex:0 0 42px; object-fit:contain;
  filter: drop-shadow(0 2px 8px oklch(62% 0.22 280 / 0.35)); }
.crest-fallback{ width:42px; height:42px; border-radius:10px; background:var(--violet-bg);
  border:1px solid var(--violet-border); display:grid; place-items:center; color:var(--violet2);
  font-family:'Bebas Neue',sans-serif; font-size:16px; }
.title-wrap{ display:flex; flex-direction:column; min-width:0; }
.title-wrap h1{ margin:0; font-family:'Bebas Neue',sans-serif; font-weight:400;
  font-size:30px; letter-spacing:.5px; color:var(--ink); line-height:1; }
.title-wrap .sub{ font-size:12.5px; color:var(--muted); margin-top:2px; }
.title-wrap .sub b{ color:var(--text); font-weight:600; }
.top-right{ margin-left:auto; display:flex; align-items:center; gap:10px; text-align:right; }
.gen-pill{
  display:inline-flex; align-items:center; gap:7px; padding:7px 12px; border-radius:999px;
  background:var(--surface2); border:1px solid var(--border2); font-size:11.5px; color:var(--muted); white-space:nowrap;
}
.gen-pill svg{ width:13px; height:13px; color:var(--green); }

.wrap{ max-width:1360px; margin:0 auto; padding:26px 28px 0; }

/* ---------- KPI strip ---------- */
.kpis{ display:grid; grid-template-columns:repeat(auto-fit, minmax(168px, 1fr)); gap:14px; margin-bottom:22px; }
.kpi{
  position:relative; overflow:hidden; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r); padding:16px 18px; box-shadow: var(--shadow-card);
}
.kpi::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:3px; border-radius:3px 0 0 3px;
  background:linear-gradient(180deg, var(--violet), var(--violet2)); }
.kpi.o::before{ background:linear-gradient(180deg, var(--orange), var(--orange2)); }
.kpi.g::before{ background:linear-gradient(180deg, var(--green), oklch(74% 0.16 152)); }
.kpi.r::before{ background:linear-gradient(180deg, var(--red), oklch(70% 0.18 30)); }
.kpi .k-label{ font-size:11.5px; color:var(--muted); font-weight:600; letter-spacing:.02em; text-transform:uppercase; }
.kpi .k-val{ font-family:'Bebas Neue',sans-serif; font-size:34px; letter-spacing:.5px; color:var(--ink); line-height:1.05; margin-top:6px; }
.kpi .k-val small{ font-family:'Inter',sans-serif; font-size:13px; font-weight:600; color:var(--muted); letter-spacing:0; margin-left:4px; }

/* ---------- controls ---------- */
.controls{ display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin-bottom:14px; }
.search{ position:relative; flex:1 1 260px; min-width:200px; max-width:360px; }
.search svg{ position:absolute; left:12px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--muted); pointer-events:none; }
.search input{
  width:100%; font-family:inherit; font-size:14px; color:var(--ink);
  background:var(--surface2); border:1px solid var(--border2); border-radius:10px;
  padding:10px 14px 10px 36px; min-height:42px; outline:none;
  transition: border-color .18s var(--ease);
}
.search input::placeholder{ color:var(--muted); }
.search input:hover{ border-color:var(--border3); }
.search input:focus{ border-color:var(--violet-border); }
.field{ position:relative; display:inline-flex; align-items:center; }
select.picker{
  appearance:none; font-family:inherit; font-size:13.5px; font-weight:500; color:var(--text);
  background:var(--surface2); border:1px solid var(--border2); border-radius:9px;
  padding:9px 34px 9px 14px; cursor:pointer; min-height:42px;
}
select.picker:hover{ border-color:var(--border3); }
.field::after{ content:""; position:absolute; right:13px; top:50%; width:8px; height:8px; pointer-events:none;
  border-right:2px solid var(--muted); border-bottom:2px solid var(--muted); transform:translateY(-70%) rotate(45deg); }
.spacer{ flex:1 1 auto; }
.btn{
  display:inline-flex; align-items:center; gap:8px; appearance:none; cursor:pointer;
  font-family:inherit; font-size:13px; font-weight:600; color:var(--text);
  background:var(--surface2); border:1px solid var(--border2); border-radius:10px;
  padding:9px 14px; min-height:42px; white-space:nowrap;
  transition: background .18s var(--ease), color .18s var(--ease), border-color .18s var(--ease), transform .1s var(--ease);
}
.btn svg{ width:15px; height:15px; }
.btn:hover{ color:var(--ink); border-color:var(--border3); background:var(--surface3); }
.btn:active{ transform:scale(.97); }
.btn.primary{ color:#1a0d05; background:var(--orange); border-color:transparent; box-shadow: var(--shadow-btn); }
.btn.primary:hover{ background:var(--orange2); color:#1a0d05; }
.btn.ghost{ background:transparent; }
.btn[disabled]{ opacity:.42; cursor:not-allowed; pointer-events:none; }

/* ---------- role filter pills ---------- */
.pills{ display:flex; gap:8px; overflow-x:auto; padding:2px 2px 10px; margin:0 -2px 18px; scrollbar-width:thin; }
.pills::-webkit-scrollbar{ height:6px; }
.pills::-webkit-scrollbar-thumb{ background:var(--border3); border-radius:3px; }
.pill{
  flex:0 0 auto; appearance:none; border:1px solid var(--border2); background:var(--surface);
  color:var(--muted); cursor:pointer; font-family:inherit; font-size:12.5px; font-weight:600;
  padding:7px 13px; border-radius:999px; white-space:nowrap; display:inline-flex; align-items:center; gap:7px;
  transition: background .18s var(--ease), color .18s var(--ease), border-color .18s var(--ease), transform .1s var(--ease);
}
.pill:hover{ color:var(--text); border-color:var(--border3); }
.pill:active{ transform:scale(.96); }
.pill .cnt{ font-size:11px; color:var(--faint); font-variant-numeric:tabular-nums; }
.pill.on{ background:var(--violet-bg); color:var(--violet2); border-color:var(--violet-border); }
.pill.on .cnt{ color:var(--violet2); }
.pill.warn.on{ background:var(--ember-bg); color:var(--orange2); border-color:var(--ember-border); }
.pill.warn.on .cnt{ color:var(--orange2); }

/* ---------- roster grid ---------- */
.grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); gap:14px; }
.pcard{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg);
  box-shadow: var(--shadow-card); padding:16px; display:flex; flex-direction:column; gap:14px;
  transition: border-color .2s var(--ease), transform .2s var(--ease);
}
.pcard:hover{ border-color:var(--border3); transform:translateY(-2px); }
.pcard-top{ display:flex; align-items:center; gap:12px; min-width:0; }
.avatar{
  flex:0 0 46px; width:46px; height:46px; border-radius:13px;
  background:linear-gradient(150deg, var(--violet-bg), oklch(62% 0.22 280 / 0.04));
  border:1px solid var(--violet-border); display:grid; place-items:center;
  font-family:'Bebas Neue',sans-serif; font-size:20px; letter-spacing:.5px; color:var(--violet2);
}
.pcard-id{ min-width:0; flex:1 1 auto; }
.pname{ font-size:14.5px; font-weight:600; color:var(--ink); line-height:1.2;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.role-wrap{ position:relative; display:inline-flex; align-items:center; margin-top:6px; max-width:100%; }
.role-wrap::after{ content:""; position:absolute; right:10px; top:50%; width:6px; height:6px; pointer-events:none;
  border-right:2px solid currentColor; border-bottom:2px solid currentColor; transform:translateY(-70%) rotate(45deg); opacity:.6; }
.role-select{
  appearance:none; font-family:inherit; font-size:11.5px; font-weight:600; cursor:pointer;
  padding:5px 24px 5px 11px; border-radius:999px; max-width:100%;
  background:var(--violet-bg); border:1px solid var(--violet-border); color:var(--violet2);
  transition: background .18s var(--ease), border-color .18s var(--ease), color .18s var(--ease);
}
.role-wrap.unassigned{ color:var(--orange2); }
.role-wrap.unassigned .role-select{
  background:transparent; border:1px dashed var(--ember-border); color:var(--orange2);
}
.role-select:hover{ border-color:var(--border3); }
.pstats{ display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; }
.pstat{ display:flex; flex-direction:column; align-items:center; gap:2px; padding:9px 4px;
  background:var(--surface2); border-radius:var(--r-sm); }
.ps-v{ font-family:'Bebas Neue',sans-serif; font-size:19px; letter-spacing:.4px; color:var(--ink); line-height:1;
  font-variant-numeric:tabular-nums; }
.ps-l{ font-size:9.5px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); }
.pcard-link{
  display:inline-flex; align-items:center; justify-content:space-between; gap:8px;
  font-size:12.5px; font-weight:600; color:var(--orange2); margin-top:auto;
  padding:9px 12px; border-radius:10px; border:1px solid var(--ember-border); background:var(--ember-bg);
  transition: background .18s var(--ease), transform .1s var(--ease);
}
.pcard-link:hover{ background:oklch(68% 0.19 42 / 0.16); }
.pcard-link:active{ transform:scale(.98); }
.pcard-link svg{ width:15px; height:15px; }
.pcard{ cursor:pointer; }
.pcard:focus-visible{ outline:2px solid var(--orange); outline-offset:2px; }
.flag-inf{
  display:inline-flex; align-items:center; gap:6px; margin-top:6px; padding:4px 10px; border-radius:999px;
  font-size:11px; font-weight:600; color:oklch(72% 0.18 25);
  background:oklch(62% 0.22 25 / 0.12); border:1px solid oklch(62% 0.22 25 / 0.26);
}
.flag-inf svg{ width:12px; height:12px; }
.flag-out{
  display:inline-flex; align-items:center; gap:6px; margin-top:6px; padding:4px 10px; border-radius:999px;
  font-size:11px; font-weight:600; color:var(--muted);
  background:var(--surface3); border:1px solid var(--border2);
}
.pcard.off{ opacity:.62; }

/* ---------- stati di disponibilita' (token semantici) ---------- */
.s-disp{ --c:var(--green);          --cbg:oklch(70% 0.18 152 / 0.13); --cbd:oklch(70% 0.18 152 / 0.30); }
.s-parz{ --c:oklch(80% 0.14 85);    --cbg:oklch(78% 0.15 85 / 0.13);  --cbd:oklch(78% 0.15 85 / 0.30); }
.s-diff{ --c:var(--violet2);        --cbg:var(--violet-bg);           --cbd:var(--violet-border); }
.s-fis{  --c:var(--orange2);        --cbg:var(--ember-bg);            --cbd:var(--ember-border); }
.s-ass{  --c:oklch(72% 0.18 25);    --cbg:oklch(62% 0.22 25 / 0.13);  --cbd:oklch(62% 0.22 25 / 0.30); }

/* ---------- pannello disponibilita' ---------- */
.avail{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg);
  box-shadow:var(--shadow-card); padding:15px 18px 17px; margin-bottom:20px;
}
.av-head{ display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
.av-title{ font-size:13.5px; font-weight:700; color:var(--ink); }
.av-sub{ font-size:11.5px; color:var(--faint); }
.av-body{ margin-top:14px; }
.av-body[hidden]{ display:none; }
.av-pool{
  display:flex; flex-wrap:wrap; align-items:center; gap:6px; min-height:50px;
  padding:9px 12px; border:1px dashed var(--border3); border-radius:var(--r);
  background:oklch(15% 0.018 38 / 0.45);
  transition:border-color .18s var(--ease), background .18s var(--ease);
}
.av-pool-l{ font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--faint); margin-right:5px; }
.av-lanes{ display:grid; grid-template-columns:repeat(auto-fit, minmax(156px, 1fr)); gap:10px; margin-top:10px; }
.av-lane{
  border:1px solid var(--border); border-radius:var(--r); background:var(--surface2);
  padding:10px 11px 11px; min-height:98px; display:flex; flex-direction:column; gap:9px;
  transition:border-color .18s var(--ease), background .18s var(--ease);
}
.av-lh{ display:flex; align-items:baseline; gap:8px; }
.av-lh .l{ font-size:10.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--c, var(--muted)); }
.av-lh .n{ margin-left:auto; font-size:11px; color:var(--faint); font-variant-numeric:tabular-nums; }
.av-drop{ display:flex; flex-wrap:wrap; gap:6px; align-content:flex-start; flex:1 1 auto; }
.av-lane.over, .av-pool.over{ border-color:var(--orange); border-style:solid; background:var(--ember-bg); }
.av-hint{ font-size:11.5px; color:var(--faint); margin:11px 0 0; max-width:72ch; }
.tok{
  appearance:none; font-family:inherit; cursor:grab; -webkit-user-select:none; user-select:none;
  font-size:11px; font-weight:700; letter-spacing:.02em; line-height:1;
  padding:6px 8px; border-radius:8px; border:1px solid var(--border2);
  background:var(--surface3); color:var(--text);
  transition:border-color .18s var(--ease), color .18s var(--ease), transform .1s var(--ease);
}
.tok:hover{ color:var(--ink); border-color:var(--border3); }
.tok:active{ transform:scale(.94); cursor:grabbing; }
.tok.drag{ opacity:.42; }
.tok.st{ background:var(--cbg); border-color:var(--cbd); color:var(--c); }
.av-chip{
  display:inline-flex; align-items:center; margin-top:6px; margin-left:6px; padding:4px 10px; border-radius:999px;
  font-size:11px; font-weight:600; background:var(--cbg); border:1px solid var(--cbd); color:var(--c);
}

/* ---------- riga aggiungi atleta ---------- */
.addrow{
  display:grid; grid-template-columns:minmax(0,1fr) 210px auto auto; gap:10px; align-items:end;
  padding:14px 16px; margin-bottom:16px;
  background:var(--surface); border:1px solid var(--border2); border-radius:var(--r);
}
.addrow[hidden]{ display:none; }
.addrow input, .addrow select{
  width:100%; font-family:inherit; font-size:14px; color:var(--ink);
  background:var(--surface2); border:1px solid var(--border2); border-radius:9px;
  padding:9px 11px; min-height:42px; outline:none; transition:border-color .18s var(--ease);
}
.addrow select{ appearance:none; cursor:pointer; padding-right:30px;
  background-image:linear-gradient(45deg, transparent 50%, oklch(58% 0.014 38) 50%), linear-gradient(135deg, oklch(58% 0.014 38) 50%, transparent 50%);
  background-position: calc(100% - 16px) 19px, calc(100% - 11px) 19px; background-size:5px 5px, 5px 5px; background-repeat:no-repeat; }
.addrow input:focus, .addrow select:focus{ border-color:var(--violet-border); }
.addrow .fld > span{ font-size:11.5px; font-weight:600; color:var(--muted); display:block; margin-bottom:6px; }

/* riconferma atlete dell'anno prima (solo stagione nuova) */
.recon{ grid-column:1 / -1; border-top:1px solid var(--border); padding-top:12px; margin-top:2px; }
.recon[hidden]{ display:none; }
.recon > p{ font-size:11.5px; color:var(--muted); margin:0 0 9px; max-width:74ch; }
.recon-list{ display:flex; flex-wrap:wrap; gap:7px; }
.recon-btn{
  appearance:none; font-family:inherit; cursor:pointer;
  font-size:11.5px; font-weight:650; line-height:1;
  display:inline-flex; align-items:center; gap:6px;
  padding:7px 11px; border-radius:999px;
  border:1px solid var(--border2); background:var(--surface2); color:var(--text);
  transition:border-color .18s var(--ease), color .18s var(--ease), transform .1s var(--ease);
}
.recon-btn:hover{ color:var(--ink); border-color:var(--border3); }
.recon-btn:active{ transform:scale(.96); }
.recon-btn svg{ width:12px; height:12px; flex:none; opacity:.62; }
.recon-btn .rl{ font-weight:500; color:var(--faint); }

/* ---------- scheda atleta (pannello laterale) ---------- */
.sheet-ov{
  position:fixed; inset:0; z-index:var(--z-sheet); background:oklch(6% 0.012 38 / 0.62);
  backdrop-filter:blur(3px); opacity:0; transition:opacity .24s var(--ease);
}
.sheet-ov.show{ opacity:1; }
.sheet{
  position:fixed; top:0; right:0; bottom:0; width:min(580px, 100%); z-index:calc(var(--z-sheet) + 1);
  background:var(--surface); border-left:1px solid var(--border2); box-shadow:var(--shadow-md);
  display:flex; flex-direction:column; transform:translateX(100%); transition:transform .28s var(--ease);
}
.sheet.show{ transform:none; }
.sheet-head{
  display:flex; align-items:center; gap:12px; padding:18px 20px; flex:0 0 auto;
  border-bottom:1px solid var(--border); background:var(--surface2);
}
.sheet-id{ min-width:0; flex:1 1 auto; }
.sheet-name{ font-family:'Bebas Neue',sans-serif; font-size:26px; letter-spacing:.5px; color:var(--ink); line-height:1.05;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sheet-sub{ font-size:12px; color:var(--muted); margin-top:2px; }
.icon-btn{
  flex:0 0 auto; appearance:none; cursor:pointer; display:grid; place-items:center; width:38px; height:38px;
  border-radius:10px; background:var(--surface3); border:1px solid var(--border2); color:var(--muted);
  transition: color .18s var(--ease), border-color .18s var(--ease), transform .1s var(--ease);
}
.icon-btn svg{ width:17px; height:17px; }
.icon-btn:hover{ color:var(--ink); border-color:var(--border3); }
.icon-btn:active{ transform:scale(.94); }
.sheet-body{ flex:1 1 auto; overflow-y:auto; overscroll-behavior:contain; }
.sh-sec{ padding:16px 20px; border-bottom:1px solid var(--border); }
.sh-sec:last-child{ border-bottom:0; padding-bottom:32px; }
.sh-h{ font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin:0 0 12px; }
.sh-h .n{ color:var(--faint); font-weight:600; }
.sh-grid{ display:grid; grid-template-columns:repeat(2, 1fr); gap:12px; }
.fld{ display:flex; flex-direction:column; gap:6px; min-width:0; }
.fld.wide{ grid-column:1 / -1; }
.fld > span{ font-size:11.5px; font-weight:600; color:var(--muted); }
.fld input, .fld select, .fld textarea{
  width:100%; font-family:inherit; font-size:14px; color:var(--ink);
  background:var(--surface2); border:1px solid var(--border2); border-radius:9px;
  padding:9px 11px; min-height:42px; outline:none;
  transition: border-color .18s var(--ease);
}
.fld textarea{ min-height:70px; resize:vertical; line-height:1.5; }
.fld select{ appearance:none; cursor:pointer; padding-right:30px;
  background-image:linear-gradient(45deg, transparent 50%, oklch(58% 0.014 38) 50%), linear-gradient(135deg, oklch(58% 0.014 38) 50%, transparent 50%);
  background-position: calc(100% - 16px) 19px, calc(100% - 11px) 19px; background-size:5px 5px, 5px 5px; background-repeat:no-repeat; }
.fld input:hover, .fld select:hover, .fld textarea:hover{ border-color:var(--border3); }
.fld input:focus, .fld select:focus, .fld textarea:focus{ border-color:var(--violet-border); }
.sh-stats{ display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; margin-bottom:12px; }
.sh-link{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  font-size:13px; font-weight:600; color:var(--orange2);
  padding:10px 13px; border-radius:10px; border:1px solid var(--ember-border); background:var(--ember-bg);
  transition: background .18s var(--ease);
}
.sh-link:hover{ background:oklch(68% 0.19 42 / 0.16); }
.sh-link svg{ width:15px; height:15px; }
.sh-links{ display:grid; grid-template-columns:repeat(auto-fit, minmax(184px, 1fr)); gap:8px; }
.fld-hint{ font-size:11px; line-height:1.45; color:var(--faint); }
.lnk-btn{
  appearance:none; background:none; border:0; padding:0; font-family:inherit; font-size:11px;
  font-weight:700; color:var(--orange2); cursor:pointer; text-decoration:underline;
  text-underline-offset:2px; transition: color .18s var(--ease);
}
.lnk-btn:hover{ color:var(--ink); }
.inf-add{ display:grid; grid-template-columns:132px 1fr 128px; gap:8px; align-items:end; margin-bottom:12px; }
.inf-add .btn{ min-height:42px; }
.inf-list{ display:flex; flex-direction:column; gap:8px; }
.inf-row{
  display:flex; align-items:center; gap:10px; padding:10px 12px;
  background:var(--surface2); border:1px solid var(--border); border-radius:10px;
}
.inf-row.done{ opacity:.62; }
.inf-main{ min-width:0; flex:1 1 auto; }
.inf-txt{ font-size:13.5px; color:var(--ink); line-height:1.3; word-break:break-word; }
.inf-meta{ font-size:11.5px; color:var(--muted); margin-top:3px; }
.st-pill{
  flex:0 0 auto; font-size:10.5px; font-weight:700; letter-spacing:.03em; text-transform:uppercase;
  padding:4px 9px; border-radius:999px; white-space:nowrap;
  background:oklch(62% 0.22 25 / 0.12); border:1px solid oklch(62% 0.22 25 / 0.26); color:oklch(72% 0.18 25);
}
.st-pill.rec{ background:oklch(78% 0.15 85 / 0.12); border-color:oklch(78% 0.15 85 / 0.26); color:oklch(80% 0.14 85); }
.st-pill.ok{ background:oklch(70% 0.18 152 / 0.12); border-color:oklch(70% 0.18 152 / 0.26); color:var(--green); }
.st-pill[data-act]{ appearance:none; -webkit-appearance:none; font-family:inherit; cursor:pointer;
  transition: filter .18s var(--ease), transform .1s var(--ease); }
.st-pill[data-act]:hover{ filter:brightness(1.18); }
.st-pill[data-act]:active{ transform:scale(.95); }
.x-btn{
  flex:0 0 auto; appearance:none; cursor:pointer; display:grid; place-items:center; width:30px; height:30px;
  border-radius:8px; background:transparent; border:1px solid var(--border2); color:var(--faint);
  transition: color .18s var(--ease), border-color .18s var(--ease); }
.x-btn svg{ width:14px; height:14px; }
.x-btn:hover{ color:oklch(72% 0.18 25); border-color:oklch(62% 0.22 25 / 0.4); }
.sh-none{ font-size:12.5px; color:var(--faint); padding:10px 0; }
.tgrp{ margin-bottom:14px; }
.tgrp:last-child{ margin-bottom:0; }
.tgrp-h{ font-size:11.5px; font-weight:700; color:var(--violet2); margin-bottom:6px; }
.tgrp-h.g{ color:var(--green); }
.tgrp-h.b{ color:oklch(74% 0.17 25); }
table.ttbl{ width:100%; border-collapse:collapse; font-size:12.5px; }
table.ttbl td{ padding:6px 8px; border-bottom:1px solid var(--border); }
table.ttbl tr:last-child td{ border-bottom:0; }
table.ttbl td.l{ color:var(--text); }
table.ttbl td.v{ text-align:right; color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums; white-space:nowrap; }
table.ttbl td.d{ text-align:right; color:var(--faint); font-size:11px; white-space:nowrap; width:1%; }
.asy{ display:inline-block; margin-left:7px; padding:2px 7px; border-radius:999px; font-size:10px; font-weight:700;
  background:var(--surface3); border:1px solid var(--border2); color:var(--muted); }
.asy.w{ background:oklch(78% 0.15 85 / 0.12); border-color:oklch(78% 0.15 85 / 0.28); color:oklch(80% 0.14 85); }
.asy.b{ background:oklch(62% 0.22 25 / 0.12); border-color:oklch(62% 0.22 25 / 0.28); color:oklch(72% 0.18 25); }
.asy.g{ background:oklch(70% 0.18 152 / 0.12); border-color:oklch(70% 0.18 152 / 0.28); color:var(--green); }
.fms-tot{ display:flex; align-items:baseline; gap:8px; margin-bottom:12px; padding:10px 12px;
  background:var(--violet-bg); border:1px solid var(--violet-border); border-radius:10px; }
.fms-tot b{ font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:.4px; color:var(--violet2); line-height:1; }
.fms-tot span{ font-size:12px; color:var(--muted); }

/* ---------- selettore disponibilita' nella scheda ---------- */
.seg{ display:grid; grid-template-columns:repeat(auto-fit, minmax(88px, 1fr)); gap:6px; }
.seg button{
  appearance:none; cursor:pointer; font-family:inherit; font-size:11.5px; font-weight:600;
  padding:10px 6px; border-radius:9px; border:1px solid var(--border2);
  background:var(--surface2); color:var(--muted);
  transition:background .18s var(--ease), color .18s var(--ease), border-color .18s var(--ease), transform .1s var(--ease);
}
.seg button:hover{ color:var(--text); border-color:var(--border3); }
.seg button:active{ transform:scale(.97); }
.seg button.on{ background:var(--cbg, var(--surface3)); border-color:var(--cbd, var(--border3)); color:var(--c, var(--ink)); }

/* ---------- profilo tecnico (punti di forza e carenze) ---------- */
.prof-blk{ margin-bottom:16px; }
.prof-blk:last-child{ margin-bottom:0; }
.prof-l{ display:block; font-size:11.5px; font-weight:600; color:var(--muted); margin-bottom:7px; }
.tag-add{ display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; }
.tag-add input{
  width:100%; font-family:inherit; font-size:14px; color:var(--ink);
  background:var(--surface2); border:1px solid var(--border2); border-radius:9px;
  padding:9px 11px; min-height:42px; outline:none; transition:border-color .18s var(--ease);
}
.tag-add input:focus{ border-color:var(--violet-border); }
.tags{ display:flex; flex-wrap:wrap; gap:6px; margin-top:9px; }
.tag{
  display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600;
  padding:5px 7px 5px 11px; border-radius:999px;
  background:var(--cbg); border:1px solid var(--cbd); color:var(--c);
}
.tag button{
  appearance:none; cursor:pointer; background:transparent; border:0; color:inherit; padding:0;
  display:grid; place-items:center; width:16px; height:16px; opacity:.62;
  transition:opacity .18s var(--ease);
}
.tag button:hover{ opacity:1; }
.tag button svg{ width:11px; height:11px; }
.tag-none{ font-size:12px; color:var(--faint); margin-top:9px; }

/* ---------- gestione rosa nella scheda ---------- */
.rost-btns{ display:flex; flex-wrap:wrap; gap:8px; margin-top:11px; }
.btn.red{ color:oklch(74% 0.17 25); background:oklch(62% 0.22 25 / 0.10); border-color:oklch(62% 0.22 25 / 0.32); }
.btn.red:hover{ color:oklch(80% 0.15 25); background:oklch(62% 0.22 25 / 0.17); border-color:oklch(62% 0.22 25 / 0.52); }

.empty{ padding:52px 20px; text-align:center; color:var(--muted); border:1px dashed var(--border2);
  border-radius:var(--r-lg); background:var(--surface); }
.empty svg{ width:34px; height:34px; color:var(--faint); margin-bottom:10px; }
.empty b{ display:block; color:var(--text); font-size:15px; margin-bottom:4px; }

.foot-note{ max-width:1360px; margin:16px auto 0; padding:0 28px; font-size:11.5px; color:var(--faint); }
.btn-sm{ font-size:12px; padding:6px 10px; min-height:34px; }

/* ---------- toast ---------- */
.toast{
  position:fixed; left:50%; bottom:24px; transform:translate(-50%, 16px); z-index:var(--z-toast);
  opacity:0; pointer-events:none; display:flex; align-items:center; gap:9px;
  padding:11px 16px; border-radius:12px; background:var(--surface3); border:1px solid var(--border3);
  box-shadow: var(--shadow-md); font-size:13px; color:var(--ink);
  transition: opacity .22s var(--ease), transform .22s var(--ease);
}
.toast svg{ width:16px; height:16px; color:var(--green); }
.toast.show{ opacity:1; transform:translate(-50%, 0); }

/* reveal */
.reveal{ opacity:0; transform:translateY(10px); animation:rv .5s var(--ease) forwards; animation-delay:calc(var(--i,0) * 34ms); }
@keyframes rv{ to{ opacity:1; transform:none; } }

/* ---------- responsive ---------- */
@media (max-width: 900px){
  .main{ padding-top:52px; }
  .topbar{ position:static; padding:12px 16px; }
  .title-wrap h1{ font-size:25px; }
  .wrap{ padding:20px 16px 0; }
  .foot-note{ padding:0 16px; }
}
@media (max-width: 560px){
  .kpis{ gap:10px; }
  .kpi .k-val{ font-size:28px; }
  .search{ max-width:none; flex-basis:100%; }
  .top-right .gen-pill{ display:none; }
  .sh-sec{ padding:14px 16px; }
  .sheet-head{ padding:14px 16px; }
  .inf-add{ grid-template-columns:1fr 1fr; }
  .inf-add .fld.wide{ grid-column:1 / -1; }
  .inf-add .btn{ grid-column:1 / -1; justify-content:center; }
  .addrow{ grid-template-columns:1fr; }
}
@media (prefers-reduced-motion: reduce){
  .reveal{ animation:none; opacity:1; transform:none; }
  .pcard:hover{ transform:none; }
  *{ transition:none !important; }
}

/* ---------- tabella solo-stampa (PDF rosa per reparto) ---------- */
#print-only{ display:none; }
#print-only .proster-h{ font-size:12.5px; font-weight:700; color:#5b2d90; margin:2px 0 10px; }
#print-only table.ptbl{ width:100%; border-collapse:collapse; font-size:11px; }
#print-only table.ptbl th, #print-only table.ptbl td{ border:1px solid #d9d2e6; padding:5px 8px; text-align:right; }
#print-only table.ptbl th.l, #print-only table.ptbl td.l{ text-align:left; }
#print-only table.ptbl thead th{ background:#5b2d90; color:#fff; }
#print-only tr.rep td{ background:#efe7f7; color:#5b2d90; font-weight:700; text-align:left; }
#print-only tr.na td.l{ color:#9f2f2d; font-style:italic; }

/* ---------- print (PDF pulito, tema chiaro) ---------- */
@media print{
  @page{ margin:13mm; }
  html,body{ background:#fff !important; color:#14110f !important; }
  body::before{ display:none !important; }
  .sb-mob-bar, .sb-mob-overlay, .sidebar, .controls, .pills, .grid, .toast,
  .sheet, .sheet-ov, .top-right, .foot-note, .avail, .addrow{ display:none !important; }
  .app{ display:block !important; }
  .main{ padding:0 !important; }
  .topbar{ position:static !important; background:#fff !important; border-bottom:1px solid #ccc !important;
    backdrop-filter:none !important; padding:0 0 10px !important; margin-bottom:12px; }
  .title-wrap h1{ color:#14110f !important; }
  .title-wrap .sub, .title-wrap .sub b{ color:#3a332e !important; }
  .wrap{ max-width:none !important; padding:0 !important; }
  .kpis{ margin:0 0 14px !important; }
  .kpi{ box-shadow:none !important; border:1px solid #ccc !important; background:#fafafa !important; break-inside:avoid; }
  .kpi::before{ background:#5b2d90 !important; }
  .kpi .k-label{ color:#5a524c !important; }
  .kpi .k-val{ color:#14110f !important; }
  .kpi .k-val small{ color:#5a524c !important; }
  #print-only{ display:block !important; }
  #print-only tr.rep td, #print-only table.ptbl thead th{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
}
</style>

<script>
(function(){
  "use strict";
  const S = window.SNAP;
  const M = S.metrics_full || [];
  const NF0 = new Intl.NumberFormat('it-IT', { maximumFractionDigits: 0 });
  const NF1 = new Intl.NumberFormat('it-IT', { maximumFractionDigits: 1 });
  const REDUCE = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  // Ruoli, note e stati sono scritti a mano e valgono per l'anno in corso: la chiave
  // di memoria porta la stagione, cosi' la 26/27 parte pulita e la 25/26 resta com'e'.
  const K = window.fioKey || function(b){ return b; };
  const LS_BIO = K('rs_fio_bio');

  // Il ruolo lo tiene `fio_sidebar.js`: qui si legge e si scrive solo passando da
  // li', cosi' quello assegnato in questa pagina arriva a tutte le altre.
  const ROLES = window.FIO_RUOLI;
  const UNASSIGNED = window.FIO_RUOLO_VUOTO;

  const iMin  = M.indexOf('Minuti') >= 0 ? M.indexOf('Minuti') : 0;
  const iDist = M.indexOf('Dist tot') >= 0 ? M.indexOf('Dist tot') : 1;

  // ---------- helpers ----------
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  const normRole = window.fioNormRuolo;
  // Come si legge un'atleta. Il nome scritto nel dato non cambia mai, cosi' il
  // carico del GPS resta agganciato: cambia solo quello che si vede a schermo.
  function disp(n){ return (typeof window.fioNome==='function') ? window.fioNome(n) : String(n==null?'':n); }
  function initials(name){
    const parts = String(name||'').trim().split(/\s+/).filter(Boolean);
    if(!parts.length) return '?';
    if(parts.length===1) return parts[0].slice(0,2).toUpperCase();
    return (parts[0][0]+parts[1][0]).toUpperCase();
  }

  // ---------- ruoli riscritti a mano ----------

  // Il peso corporeo lo registra il fisio nella pagina Test con questa chiave.
  // Qui non e' un test come gli altri (non si confronta con la squadra), serve
  // solo a riempire da solo il campo Peso della scheda.
  const K_PESO = 'fis_peso';
  function pesoTest(nm, reg){
    const r = reg || loadReg();
    const v = regVal(r, K_PESO, nm);
    if(v==null) return null;
    return { v:v, d:regDay(r, K_PESO, nm) };
  }
  // Valore unico di un test per l'atleta. Sui bilaterali l'FMS prende il lato
  // peggiore, che e' la regola del punteggio; gli altri la media dei due lati.
  function testVal(reg, t, nm){
    if(t.k) return regVal(reg, t.k, nm);
    const dx = regVal(reg, t.dx, nm), sx = regVal(reg, t.sx, nm);
    if(dx==null && sx==null) return null;
    if(dx==null) return sx;
    if(sx==null) return dx;
    return t.fms ? Math.min(dx, sx) : (dx + sx) / 2;
  }
  // Differenza destra/sinistra: percentuale sui salti, punti sull'FMS, cm sullo Y-balance.
  function asymOf(t, dx, sx){
    if(dx==null || sx==null) return null;
    let d, txt;
    if(t.asym==='pct'){
      const mx = Math.max(dx, sx);
      d = mx>0 ? Math.abs(dx-sx)/mx*100 : 0;
      txt = NF1.format(d)+'%';
    } else {
      d = Math.abs(dx-sx);
      txt = NF1.format(d)+(t.asym==='cm' ? ' cm' : ' pt');
    }
    return { d:d, txt:txt, cls:(d>=t.bad ? 'b' : (d>=t.warn ? 'w' : '')) };
  }

  // ---------- build player model ----------
  // La lista parte dalla rosa condivisa di `fio_sidebar.js`, la stessa che usano
  // Forza, Sedute e il calendario: un'atleta scritta a mano qui compare anche
  // di la', e una che quest'anno non c'e' piu' sparisce da tutte le pagine in
  // una volta sola. Qui si usa la rosa completa, fuori rosa comprese, perche'
  // questa e' l'unica pagina che le deve poter rimettere dentro.
  // I minuti, i chilometri e le presenze restano quelli del carico GPS.
  function buildPlayers(){
    const src = S.players || {};
    const rosa = (typeof window.fioRosterFull==='function')
      ? window.fioRosterFull()
      : Object.keys(src).map(n=> ({ name:n, role:(src[n]||{}).role, tipo:'' }));
    const result = rosa.map(rp=>{
      const name = rp.name;
      const p = src[name] || {};
      const months = p.months || [];
      let min=0, dist=0, sedute=0, partite=0;
      months.forEach(m=>{
        (m.rows||[]).forEach(r=>{
          if(r.type==='day') sedute++;
          else if(r.type==='match') partite++;
          else if(r.type==='tot_month'){
            const vm = (r.v && r.v[iMin]  != null) ? r.v[iMin]  : 0;
            const vd = (r.v && r.v[iDist] != null) ? r.v[iDist] : 0;
            min  += (+vm||0);
            dist += (+vd||0);
          }
        });
      });
      const snapRole = normRole(p.role || rp.role || '');
      const custom = rp.tipo==='manuale' || Object.prototype.hasOwnProperty.call(customPlayers, name);
      return { name, snapRole, min, dist, sedute, partite, custom };
    });
    return result.sort((a,b)=> disp(a.name).localeCompare(disp(b.name),'it'));
  }
  function rebuildPlayers(){

    if(typeof window.fioNomiRicarica==='function') window.fioNomiRicarica();

  // ---------- filter pills ----------
  function renderPills(){
    const host = document.getElementById('pills');

    let unassignedCount = 0;
    const att = activeRoster();
    att.forEach(pl=>{ const r = effRole(pl); if(r && counts.hasOwnProperty(r)) counts[r]++; else if(!r) unassignedCount++; });
    let html = '';
    html += pillHTML('__all__', 'Tutte', att.length, false);
    ROLES.forEach(r=>{ if(counts[r]>0) html += pillHTML(r, r, counts[r], false); });
    if(unassignedCount>0) html += pillHTML('__none__', UNASSIGNED, unassignedCount, true);
    const offCount = PLAYERS.length - att.length;
    if(offCount>0) html += pillHTML('__off__', 'Fuori rosa', offCount, true);
    else if(state.filter==='__off__') state.filter = '__all__';

  // ---------- grid ----------
  function currentList(){

      // si cerca sia per come e' scritta nel dato sia per come si legge:
      // "faggioli" trova anche l'atleta scritta "Faggioli Federica"
      if(q && pl.name.toLowerCase().indexOf(q)<0 && disp(pl.name).toLowerCase().indexOf(q)<0) return false;
      const off = isOff(pl.name);
      if(state.filter==='__off__') return off;
      if(off) return false;
      if(state.filter==='__all__') return true;
      const r = effRole(pl);
      if(state.filter==='__none__') return !r;
      return r===state.filter;
    });
    const s = state.sort;
    const alfa = (a,b)=> disp(a.name).localeCompare(disp(b.name),'it');
    list = list.slice().sort((a,b)=>{
      if(s==='minuti')  return b.min-a.min || alfa(a,b);
      if(s==='sedute')  return b.sedute-a.sedute || alfa(a,b);
      if(s==='partite') return b.partite-a.partite || alfa(a,b);
      return alfa(a,b);
    });
    return list;
  }

      ROLES.map(role=> '<option value="'+esc(role)+'"'+(role===r?' selected':'')+'>'+esc(role)+'</option>').join('');
    // Il peso arriva da solo dall'ultima rilevazione del fisio nella pagina Test.
    // Se qui dentro c'e' un valore scritto a mano quello vince, con il pulsante
    // per tornare al dato dei test.
    const auto = pesoTest(pl.name);
    const man  = String(b.peso||'').trim();
    // la rilevazione a volte e' datata (2026-08-12), a volte e' la sessione ("agosto")
    const quando = auto ? (fmtDay(auto.d) || String(auto.d||'')) : '';
    let pesoVal = man, hint = '';
    if(auto && !man){
      pesoVal = fmtNum(auto.v).replace(',', '.');
      hint = '<span class="fld-hint">Preso dai test'+(quando ? ' di '+esc(quando) : '')+'. Scrivendo qui vince il valore a mano.</span>';
    } else if(auto && man){
      const diverso = Math.abs((+man.replace(',', '.')) - auto.v) >= 0.05;
      hint = '<span class="fld-hint">Nei test '+esc(fmtNum(auto.v))+' kg'+(quando ? ' di '+esc(quando) : '')+'.'+
        (diverso ? ' <button type="button" class="lnk-btn" id="peso-auto">Usa quello dei test</button>' : '')+'</span>';
    } else if(man){
      hint = '<span class="fld-hint">Scritto a mano: nei test della stagione il peso non c\'e\'.</span>';
    } else {
      hint = '<span class="fld-hint">Se il fisio lo registra nei test compare qui da solo.</span>';
    }
    // Nome mostrato. I file GPS scrivono nome e cognome quando in rosa ci sono
    // due atlete che si chiamano uguale: e' successo con le due Pieri, e da li'
    // sono rimasti "Pieri Viola" e "Faggioli Federica". Il nome del dato resta
    // com'e', altrimenti il carico non si aggancia piu': qui si cambia soltanto
    // come si legge, a schermo e sui fogli stampati, in tutte le pagine.
    const nomeAuto = (typeof window.fioNomeAuto==='function') ? window.fioNomeAuto(pl.name) : pl.name;
    const nomeOv   = (typeof window.fioNomiOverride==='function') ? (window.fioNomiOverride()[pl.name] || '') : '';
    const nomeHint = nomeOv
      ? 'Nei dati resta '+esc(pl.name)+'. Svuota la casella per tornare a '+esc(nomeAuto)+'.'
      : (nomeAuto !== pl.name
          ? 'Nei dati resta '+esc(pl.name)+', il GPS si aggancia lo stesso. Scrivi qui per cambiare come si legge.'
          : 'Vale ovunque: Forza, sedute, calendario e fogli stampati.');
    return '<section class="sh-sec">'+
      '<h3 class="sh-h">Anagrafica</h3>'+
      '<div class="sh-grid">'+
        '<div class="fld wide"><span>Nome mostrato</span>'+
          '<input id="sh-nome" type="text" autocomplete="off" placeholder="'+esc(nomeAuto)+'" value="'+esc(nomeOv)+'">'+
          '<span class="fld-hint">'+nomeHint+'</span>'+
        '</div>'+
        '<div class="fld wide"><span>Ruolo</span><select id="sh-role" aria-label="Ruolo">'+opts+'</select></div>'+
        '<div class="fld"><span>Peso (kg)</span>'+
          '<input id="sh-peso" type="number" inputmode="decimal" min="35" max="110" step="0.1" placeholder="es. 58.5" value="'+esc(pesoVal)+'">'+
          hint+
        '</div>'+
        '<div class="fld"><span>Altezza (cm)</span>'+
          '<input id="sh-alt" type="number" inputmode="numeric" min="140" max="200" step="1" placeholder="es. 168" value="'+esc(b.alt||'')+'">'+
        '</div>'+
        '<div class="fld wide"><span>Note</span>'+
          '<textarea id="sh-note" placeholder="Limitazioni, indicazioni, storico">'+esc(b.note||'')+'</textarea>'+
        '</div>'+
      '</div>'+
    '</section>';
  }

  function stClass(st){ return st==='risolto' ? 'ok' : (st==='recupero' ? 'rec' : ''); }

  // sezione 4: storico test
  function secTest(pl){
    const reg = loadReg();
    const nm = pl.name;
    let fmsTot = 0, fmsN = 0;
    TVIEWS.forEach(t=>{
      if(!t.fms) return;
      const v = testVal(reg, t, nm);
      if(v!=null){ fmsTot += v; fmsN++; }
    });
    let out = '';
    TCATS.forEach(cat=>{
      const rows = [];
      TVIEWS.forEach(t=>{
        if(t.cat!==cat.key) return;
        if(t.k){
          const v = regVal(reg, t.k, nm);
          if(v==null) return;
          rows.push('<tr><td class="l">'+esc(t.label)+'</td>'+
            '<td class="v">'+fmtNum(v)+' '+esc(t.unit)+'</td>'+
            '<td class="d">'+esc(regDay(reg, t.k, nm))+'</td></tr>');
          return;
        }
        const dx = regVal(reg, t.dx, nm), sx = regVal(reg, t.sx, nm);
        if(dx==null && sx==null) return;
        let asy = '';
        const a = asymOf(t, dx, sx);
        if(a){
          asy = '<span class="asy'+(a.cls?' '+a.cls:'')+'" title="Differenza destra/sinistra">'+esc(a.txt)+'</span>';
        }
        const val = (dx!=null?fmtNum(dx):'-')+' / '+(sx!=null?fmtNum(sx):'-');
        const day = regDay(reg, t.dx, nm) || regDay(reg, t.sx, nm);
        rows.push('<tr><td class="l">'+esc(t.label)+asy+'</td>'+
          '<td class="v">'+val+' '+esc(t.unit)+'</td>'+
          '<td class="d">'+esc(day)+'</td></tr>');
      });
      if(!rows.length) return;
      out += '<div class="tgrp"><div class="tgrp-h">'+esc(cat.label)+'</div>'+
        '<table class="ttbl"><tbody>'+rows.join('')+'</tbody></table></div>';
    });
    let head = '';
    if(fmsN>0){
      head = '<div class="fms-tot"><b>'+NF0.format(fmsTot)+'/21</b>'+
        '<span>punteggio FMS su '+fmsN+' test registrati</span></div>';
    }
    if(!out){
      return '<section class="sh-sec">'+
        '<h3 class="sh-h">Storico test</h3>'+
        '<div class="sh-none">Nessun test registrato nella stagione '+esc(seasonLbl())+'.</div>'+
        '<a class="sh-link" href="piani.html">Vai alla pagina Test'+ARROW+'</a>'+
      '</section>';
    }
    return '<section class="sh-sec">'+
      '<h3 class="sh-h">Storico test <span class="n">'+esc(seasonLbl())+'</span></h3>'+
      head + out +
      '<a class="sh-link" href="piani.html">Modifica i test'+ARROW+'</a>'+
    '</section>';
  }

  // sezione 5: dove va bene e dove no, misurato sulla squadra
  // Il confronto e' con le atlete in rosa che hanno fatto lo stesso test: sotto le
  // quattro un piazzamento non vuole dire niente, quindi il test resta fuori.
  function secSintesi(pl){
    const reg = loadReg();
    const nm  = pl.name;
    const nomi = activeRoster().map(p=> p.name);
    if(nomi.indexOf(nm) < 0) nomi.push(nm); // anche se e' fuori rosa, il suo dato si confronta

    const righe = [];
    TVIEWS.forEach(t=>{
      const v = testVal(reg, t, nm);
      if(v==null) return;
      const vals = [];
      nomi.forEach(o=>{ const x = testVal(reg, t, o); if(x!=null) vals.push(x); });
      if(vals.length < 4) return;
      let meglio = 0, pari = 0;
      // in questi test il numero alto e' sempre il migliore
      vals.forEach(x=>{ if(x > v) meglio++; else if(x === v) pari++; });
      const ord = vals.slice().sort((a,b)=> a-b);
      const mid = Math.floor(ord.length/2);
      const med = ord.length%2 ? ord[mid] : (ord[mid-1]+ord[mid])/2;
      // Sull'FMS meta' squadra prende 3: un primo posto in dieci a pari merito non e'
      // un punto di forza. Per l'ordine conta il centro del gruppo dei pari.
      righe.push({ label:t.label, unit:t.unit, v:v, med:med, pos:meglio+1, n:vals.length, pari:pari-1,
                   r:(vals.length>1) ? (meglio + (pari-1)/2) / (vals.length-1) : 0 });
    });
    righe.sort((a,b)=> a.r - b.r || a.label.localeCompare(b.label,'it'));

    // asimmetrie oltre la soglia rossa: sono critiche a prescindere dalla squadra
    const asimm = [];
    TVIEWS.forEach(t=>{
      if(!t.dx) return;
      const a = asymOf(t, regVal(reg, t.dx, nm), regVal(reg, t.sx, nm));
      if(a && a.cls==='b') asimm.push({ label:t.label, txt:a.txt });
    });

    let top = [], bot = [];
    if(righe.length===1) top = righe.slice();
    else if(righe.length>1){
      const k = Math.min(3, Math.floor(righe.length/2));
      top = righe.slice(0, k);
      bot = righe.slice(righe.length - k).reverse();
    }

    function tab(list){
      return '<table class="ttbl"><tbody>'+ list.map(r=>
        '<tr><td class="l">'+esc(r.label)+
          '<span class="asy'+(r.r<=0.34?' g':(r.r>=0.66?' b':''))+'" title="'+
            (r.pari>0 ? 'Piazzamento in squadra, a pari merito con altre '+r.pari : 'Piazzamento in squadra')+'">'+
            (r.pari>0 ? '= ' : '')+r.pos+'a su '+r.n+'</span></td>'+
          '<td class="v">'+fmtNum(r.v)+' '+esc(r.unit)+'</td>'+
          '<td class="d">mediana '+fmtNum(r.med)+'</td></tr>').join('') +'</tbody></table>';
    }

    let out = '';
    if(top.length) out += '<div class="tgrp"><div class="tgrp-h g">Dove va meglio</div>'+tab(top)+'</div>';
    if(bot.length) out += '<div class="tgrp"><div class="tgrp-h b">Dove serve lavorare</div>'+tab(bot)+'</div>';
    if(asimm.length){
      out += '<div class="tgrp"><div class="tgrp-h b">Asimmetrie oltre la soglia</div>'+
        '<table class="ttbl"><tbody>'+ asimm.map(a=>
          '<tr><td class="l">'+esc(a.label)+'</td><td class="v">'+esc(a.txt)+'</td></tr>').join('') +
        '</tbody></table></div>';
    }
    if(!out) out = '<div class="sh-none">Per il confronto serve lo stesso test su almeno quattro atlete della rosa.</div>';

    return '<section class="sh-sec">'+
      '<h3 class="sh-h">Punti forti e critici <span class="n">confronto squadra</span></h3>'+
      out +
      '<div class="sh-links">'+
        '<a class="sh-link" href="piani.html">Registra i test'+ARROW+'</a>'+
        '<a class="sh-link" href="carico.html?atleta='+encodeURIComponent(pl.name)+'">Vedi il carico'+ARROW+'</a>'+
      '</div>'+
    '</section>';
  }

  // wiring dei campi della scheda
  function wireSheet(pl){
    const b = bioOf(pl.name);
    const host = document.getElementById('sh-body');

    const roleSel = document.getElementById('sh-role');
    if(roleSel) roleSel.addEventListener('change', ()=>{
      const val = normRole(roleSel.value);
      setRole(pl.name, val);
      setSheetSub(val);
      renderKPIs(); renderPills(); renderGrid(); updateResetBtn(); buildPrintRoster();
      toast('Ruolo aggiornato: '+disp(pl.name));
    });

    // Il nome mostrato passa da `fio_sidebar.js`: scritto qui vale in tutte le
    // pagine, e lasciando la casella vuota si torna a quello automatico.
    const nomeInp = document.getElementById('sh-nome');
    if(nomeInp && typeof window.fioSetNome==='function') nomeInp.addEventListener('change', ()=>{
      const letto = window.fioSetNome(pl.name, nomeInp.value);
      PLAYERS.sort((a,b)=> disp(a.name).localeCompare(disp(b.name),'it'));
      document.getElementById('sh-name').textContent = letto;
      renderSheetBody(); renderGrid(); renderAvail(); buildPrintRoster();
      toast('Nome mostrato: '+letto);
    });

    [['sh-peso','peso'], ['sh-alt','alt'], ['sh-note','note']].forEach(pair=>{
      const el = document.getElementById(pair[0]);
      if(!el) return;
      el.addEventListener('change', ()=>{
        b[pair[1]] = String(el.value||'').trim();
        saveBio();
        if(pair[1]==='peso') renderSheetBody(); // la riga sotto il campo cambia insieme al valore
        toast('Scheda salvata: '+disp(pl.name));
      });
    });

    // torna al peso rilevato nei test: si cancella il valore scritto a mano
    const pesoAuto = document.getElementById('peso-auto');
    if(pesoAuto) pesoAuto.addEventListener('click', ()=>{
      b.peso = '';
      saveBio(); renderSheetBody();
      toast('Peso ripreso dai test');
    });

    const addBtn = document.getElementById('inf-add');
    if(addBtn) addBtn.addEventListener('click', ()=>{
      const ti = document.getElementById('inf-t');
      const di = document.getElementById('inf-d');
      const txt = String(ti.value||'').trim();
      if(!txt){ ti.focus(); toast('Serve una descrizione'); return; }
      b.inf.push({
        id: 'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
        d: di.value || todayISO(),
        txt: txt,
        st: 'infortunio'
      });
      saveBio(); renderSheetBody(); renderKPIs(); renderGrid();
      toast('Infortunio registrato');
    });

    host.querySelectorAll('[data-act="st"]').forEach(el=> el.addEventListener('click', ()=>{
      const row = el.closest('.inf-row'); if(!row) return;
      const id = row.getAttribute('data-id');
      const it = b.inf.filter(x=> String(x.id)===String(id))[0];
      if(!it) return;
      it.st = it.st==='infortunio' ? 'recupero' : (it.st==='recupero' ? 'risolto' : 'infortunio');
      saveBio(); renderSheetBody(); renderKPIs(); renderGrid();
      toast(disp(pl.name)+': '+stLabel(it.st).toLowerCase());
    }));

    host.querySelectorAll('[data-act="del"]').forEach(el=> el.addEventListener('click', ()=>{
      const row = el.closest('.inf-row'); if(!row) return;
      const id = row.getAttribute('data-id');
      let idx = -1;
      b.inf.forEach((x,i)=>{ if(String(x.id)===String(id)) idx = i; });
      if(idx<0) return;
      b.inf.splice(idx, 1);
      saveBio(); renderSheetBody(); renderKPIs(); renderGrid();
      toast('Infortunio rimosso');
    }));

    // disponibilita' dalla scheda
    host.querySelectorAll('[data-disp]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const k = btn.getAttribute('data-disp');
        avail[pl.name] = k;
        saveAvail();
        renderSheetBody();
        renderAvail();
        toast('Disponibilita\' aggiornata');
      });
    });

    // punti di forza
    const strIn = document.getElementById('str-in');
    const strAdd = document.getElementById('str-add');
    if(strAdd) strAdd.addEventListener('click', ()=>{
      const v = String(strIn && strIn.value || '').trim();
      if(!v){ if(strIn) strIn.focus(); return; }
      b.strengths.push(v);
      if(strIn) strIn.value = '';
      saveBio(); renderSheetBody();
    });
    const strTags = document.getElementById('str-tags');
    if(strTags) strTags.querySelectorAll('[data-ti]').forEach(x=> x.addEventListener('click', ()=>{
      const i = +x.getAttribute('data-ti');
      if(i >= 0 && i < b.strengths.length){ b.strengths.splice(i, 1); saveBio(); renderSheetBody(); }
    }));

    // carenze
    const wkIn = document.getElementById('wk-in');
    const wkAdd = document.getElementById('wk-add');
    if(wkAdd) wkAdd.addEventListener('click', ()=>{
      const v = String(wkIn && wkIn.value || '').trim();
      if(!v){ if(wkIn) wkIn.focus(); return; }
      b.weaknesses.push(v);
      if(wkIn) wkIn.value = '';
      saveBio(); renderSheetBody();
    });
    const wkTags = document.getElementById('wk-tags');
    if(wkTags) wkTags.querySelectorAll('[data-ti]').forEach(x=> x.addEventListener('click', ()=>{
      const i = +x.getAttribute('data-ti');
      if(i >= 0 && i < b.weaknesses.length){ b.weaknesses.splice(i, 1); saveBio(); renderSheetBody(); }
    }));

    // gestione rosa
    const togOff = document.getElementById('sh-toggle-off');
    if(togOff) togOff.addEventListener('click', ()=>{
      b.off = !b.off;
      saveBio();
      renderSheetBody();
      renderKPIs(); renderPills(); renderGrid(); renderAvail(); renderSubtitle();
      toast(b.off ? disp(pl.name) + ' fuori dalla rosa operativa' : disp(pl.name) + ' reintegrata');
    });
    const delBtn = document.getElementById('sh-delete-player');
    if(delBtn) delBtn.addEventListener('click', ()=>{
      if(!window.confirm('Eliminare definitivamente ' + disp(pl.name) + '?')) return;
      delete customPlayers[pl.name]; saveCustom();
      delete bio[pl.name]; saveBio();
      delete avail[pl.name]; saveAvail();
      rebuildPlayers();
      closeSheet();
      renderKPIs(); renderPills(); renderGrid(); renderAvail(); renderSubtitle();
      renderRecon();
      toast('Atleta eliminata');
    });
  }

  // ---------- role edit ----------
  function onRoleChange(e){

    const val = normRole(sel.value);

  // ---------- export CSV ----------
  function exportCSV(){
    const att = activeRoster();
    const rows = [['player','role']];
    att.forEach(pl=> rows.push([pl.name, effRole(pl)]));
    const csv = rows.map(r=> r.map(csvCell).join(';')).join('\r\n');
    const blob = new Blob(['﻿'+csv], { type:'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'rosa_ruoli_'+dateStamp()+'.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=> URL.revokeObjectURL(url), 1500);
    toast('CSV ruoli esportato ('+att.length+' atlete)');
  }
  function csvCell(v){
    const s = String(v==null?'':v);
    return /[";\r\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }
  function dateStamp(){
    const d = new Date(), p = n=> String(n).padStart(2,'0');
    return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate());
  }

  // ---------- raggruppa la rosa per reparto (ordine ROLES, ordinata per minuti) ----------
  function groupByReparto(){
    const order = ROLES.slice();
    const groups = {}; order.forEach(r=> groups[r]=[]);
    const none = [];
    activeRoster().forEach(pl=>{ const r=effRole(pl); if(r && groups[r]) groups[r].push(pl); else none.push(pl); });
    const byMin = arr=> arr.slice().sort((a,b)=> b.min-a.min || a.name.localeCompare(b.name,'it'));
    order.forEach(r=> groups[r]=byMin(groups[r]));
    return { order, groups, none: byMin(none) };
  }

  // ---------- tabella solo-stampa (PDF) ----------
  function buildPrintRoster(){
    const host = document.getElementById('print-only');
    if(!host) return;
    const { order, groups, none } = groupByReparto();
    let rows='';
    const emit = (label, arr, na)=>{
      if(!arr.length) return;
      rows += '<tr class="rep"><td class="l" colspan="5">'+esc(label)+' &#183; '+arr.length+'</td></tr>';
      arr.forEach(pl=>{
        rows += '<tr'+(na?' class="na"':'')+'><td class="l">'+esc(disp(pl.name))+'</td>'+
          '<td>'+NF0.format(Math.round(pl.min))+'</td>'+
          '<td>'+NF0.format(pl.sedute)+'</td>'+
          '<td>'+NF0.format(pl.partite)+'</td>'+
          '<td>'+NF1.format(pl.dist/1000)+'</td></tr>';
      });
    };
    order.forEach(r=> emit(r, groups[r], false));
    emit(UNASSIGNED, none, true);
    const tot = activeRoster().length;
    const assigned = tot - none.length;
    const gen = S.generato ? ('agg. '+esc(S.generato)) : 'anteprima';
    host.innerHTML =
      '<div class="proster-h">Rosa Fiorentina Primavera U19W &#183; '+tot+' atlete ('+assigned+' assegnate, '+none.length+' da assegnare) &#183; Stagione '+esc(S.stagione||'2025-26')+' &#183; '+gen+'</div>'+
      '<table class="ptbl"><thead><tr><th class="l">Atleta</th><th>Min</th><th>Sedute</th><th>Partite</th><th>Km</th></tr></thead>'+
      '<tbody>'+rows+'</tbody></table>';
  }

  // ---------- export XLS (Excel vero, con colori, per reparto) ----------
  function exportXLS(){
    const VIO='#5b2d90', VIOL='#efe7f7', BRD='#d9d2e6', MUT='#6b6472', REDBG='#fdebec', REDT='#9f2f2d';
    const { order, groups, none } = groupByReparto();
    let body='';
    const emit = (label, arr, na)=>{
      if(!arr.length) return;
      body += '<tr class="rep"><td class="lbl" colspan="6">'+esc(label)+' &#183; '+arr.length+'</td></tr>';
      arr.forEach(pl=>{
        body += '<tr'+(na?' class="na"':'')+'><td class="lbl">'+esc(disp(pl.name))+'</td>'+
          '<td class="lbl">'+esc(effRole(pl)||UNASSIGNED)+'</td>'+
          '<td>'+NF0.format(Math.round(pl.min))+'</td>'+
          '<td>'+NF0.format(pl.sedute)+'</td>'+
          '<td>'+NF0.format(pl.partite)+'</td>'+
          '<td>'+NF1.format(pl.dist/1000)+'</td></tr>';
      });
    };
    order.forEach(r=> emit(r, groups[r], false));
    emit(UNASSIGNED, none, true);
    const tot = activeRoster().length;
    const assigned = tot - none.length;

    let h = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel">'+
      '<head><meta charset="utf-8"><!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet>'+
      '<x:Name>Rosa</x:Name><x:WorksheetOptions><x:DisplayGridlines/></x:WorksheetOptions></x:ExcelWorksheet>'+
      '</x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]-->'+
      '<style>table{border-collapse:collapse;font-family:Calibri,Arial,sans-serif;font-size:11pt}'+
      'td,th{border:1px solid '+BRD+';padding:5px 9px;text-align:right}'+
      'th{background:'+VIO+';color:#fff;font-weight:700;text-align:center}'+
      'td.lbl,th.lbl{text-align:left}td.lbl{font-weight:500}'+
      'tr.rep td{background:'+VIOL+';font-weight:700;color:'+VIO+';text-align:left}'+
      'tr.na td{background:'+REDBG+'}tr.na td.lbl{color:'+REDT+'}'+
      '.ttl{font-size:15pt;font-weight:700;color:'+VIO+';border:none;text-align:left}'+
      '.sub{color:'+MUT+';border:none;text-align:left}</style></head><body>';
    h += '<table><tr><td class="ttl" colspan="6">Rosa Fiorentina Primavera U19W</td></tr>'+
      '<tr><td class="sub" colspan="6">'+tot+' atlete &#183; '+assigned+' assegnate &#183; '+none.length+' da assegnare &#183; Stagione '+esc(S.stagione||'2025-26')+'</td></tr>'+
      (S.generato?'<tr><td class="sub" colspan="6">Aggiornato: '+esc(S.generato)+'</td></tr>':'')+
      '</table>';
    h += '<table><tr><th class="lbl">Atleta</th><th class="lbl">Ruolo</th><th>Minuti</th><th>Sedute</th><th>Partite</th><th>Km</th></tr>'+body+'</table>';
    h += '</body></html>';

    const blob = new Blob(['﻿'+h], { type:'application/vnd.ms-excel;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'rosa_ruoli_'+dateStamp()+'.xls';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=> URL.revokeObjectURL(url), 1500);
    toast('Excel rosa esportato ('+tot+' atlete)');
  }

  // ---------- reset overrides ----------
  function resetOverrides(){
    if(!overrideCount()) return;
    clearRoles();
    renderKPIs(); renderPills(); renderGrid(); updateResetBtn();
    toast('Modifiche ai ruoli annullate');
  }

  // ---------- toast ----------
  let toastTmr=null;
  function toast(msg){
    const t = document.getElementById('toast');
    t.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>'+esc(msg);
    t.classList.add('show');
    clearTimeout(toastTmr);
    toastTmr = setTimeout(()=> t.classList.remove('show'), 3000);
  }

  // ---------- logo ----------
  (function(){
    const c = document.getElementById('crest');
    c.src = S.logo || './fiorentina.png';
    c.addEventListener('error', function(){
      const f=document.createElement('div'); f.className='crest-fallback'; f.textContent='ACF'; c.replaceWith(f);
    });
  })();
  document.getElementById('gen-txt').textContent = S.generato ? ('agg. '+S.generato) : 'anteprima';
  renderSubtitle();

  // ---------- wiring ----------
  let qTmr=null;
  document.getElementById('search').addEventListener('input', e=>{
    clearTimeout(qTmr); const v=e.target.value;
    qTmr = setTimeout(()=>{ state.q=v; renderGrid(); }, 120);
  });
  document.getElementById('sort').addEventListener('change', e=>{ state.sort=e.target.value; renderGrid(); });
  document.getElementById('btn-export').addEventListener('click', exportCSV);
  document.getElementById('btn-xls').addEventListener('click', exportXLS);
  document.getElementById('btn-print').addEventListener('click', ()=>{ buildPrintRoster(); window.print(); });
  document.getElementById('btn-reset').addEventListener('click', resetOverrides);
  window.addEventListener('beforeprint', buildPrintRoster);
  document.getElementById('sh-close').addEventListener('click', closeSheet);
  elOv.addEventListener('click', closeSheet);
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeSheet(); });
  document.addEventListener('fio:stagione', ()=>{ if(shName) renderSheetBody(); });

  // ---------- disponibilita' nella scheda (sezione) ----------
  function secDisp(pl){
    const st = avail[pl.name] || 'disponibile';
    const av = AVAIL_STATES.find(s=> s.k===st) || AVAIL_STATES[0];
    return '<section class="sh-sec">'+
      '<h3 class="sh-h">Disponibilita\'</h3>'+
      '<div class="seg '+av.cls+'">'+
        AVAIL_STATES.map(s=>
          '<button class="'+s.cls+(s.k===st?' on':'')+'" data-disp="'+esc(s.k)+'" aria-pressed="'+(s.k===st)+'">'+esc(s.l)+'</button>'
        ).join('')+
      '</div>'+
    '</section>';
  }

  // ---------- profilo tecnico (sezione) ----------
  function secProfilo(pl){
    const b = bioOf(pl.name);
    if(!Array.isArray(b.strengths)) b.strengths = [];
    if(!Array.isArray(b.weaknesses)) b.weaknesses = [];
    function tagListHtml(arr, cls){
      if(!arr.length) return '<span class="tag-none">Nessuno registrato.</span>';
      return arr.map((t,i)=>
        '<span class="tag '+cls+'">'+esc(t)+
          '<button data-ti="'+i+'" aria-label="Rimuovi '+esc(t)+'">'+
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>'+
          '</button>'+
        '</span>'
      ).join('');
    }
    return '<section class="sh-sec">'+
      '<h3 class="sh-h">Profilo tecnico</h3>'+
      '<div class="prof-blk s-disp">'+
        '<span class="prof-l">Punti di forza</span>'+
        '<div class="tag-add">'+
          '<input id="str-in" type="text" placeholder="es. velocita\' in progressione">'+
          '<button class="btn btn-sm" id="str-add">Aggiungi</button>'+
        '</div>'+
        '<div class="tags" id="str-tags">'+tagListHtml(b.strengths,'s-disp')+'</div>'+
      '</div>'+
      '<div class="prof-blk s-ass" style="margin-top:14px">'+
        '<span class="prof-l">Carenze</span>'+
        '<div class="tag-add">'+
          '<input id="wk-in" type="text" placeholder="es. resistenza aerobica">'+
          '<button class="btn btn-sm" id="wk-add">Aggiungi</button>'+
        '</div>'+
        '<div class="tags" id="wk-tags">'+tagListHtml(b.weaknesses,'s-ass')+'</div>'+
      '</div>'+
    '</section>';
  }

  // ---------- gestione rosa (sezione) ----------
  function secRosa(pl){
    const b = bioOf(pl.name);
    const isOff = !!(b.off);
    return '<section class="sh-sec">'+
      '<h3 class="sh-h">Gestione rosa</h3>'+
      '<div class="rost-btns">'+
        '<button class="btn ghost" id="sh-toggle-off">'+esc(isOff ? 'Reintegra in rosa' : 'Metti fuori rosa')+'</button>'+
        (pl.custom ? '<button class="btn red" id="sh-delete-player">Elimina definitivamente</button>' : '')+
      '</div>'+
      (isOff ? '<p style="margin:8px 0 0;font-size:12px;color:var(--muted)">Fuori dalla rosa operativa. Resta nello storico.</p>' : '')+
    '</section>';
  }

  // ---------- pannello disponibilita' ----------
  let draggedName = null;
  function renderAvail(){
    const body = document.getElementById('avail-body');
    if(!body) return;
    const activePlayers = PLAYERS.filter(pl=>{ const b=bio[pl.name]; return !(b&&b.off); });
    const byState = {};
    AVAIL_STATES.forEach(s=> byState[s.k]=[]);
    activePlayers.forEach(pl=>{
      const k = avail[pl.name] || 'disponibile';
      const bucket = byState[k] || byState['disponibile'];
      bucket.push(pl);
    });
    body.innerHTML = '<div class="av-lanes">'+
      AVAIL_STATES.map(s=>
        '<div class="av-lane '+s.cls+'" data-lane="'+esc(s.k)+'">'+
          '<div class="av-lh"><span class="l">'+esc(s.l)+'</span><span class="n tnum">'+byState[s.k].length+'</span></div>'+
          '<div class="av-drop">'+
            byState[s.k].map(pl=>
              '<div class="tok st '+s.cls+'" draggable="true" data-name="'+esc(pl.name)+'" title="'+esc(disp(pl.name))+'" tabindex="0" role="button" aria-label="'+esc(disp(pl.name))+'">'+
                esc(initials(pl.name))+
              '</div>'
            ).join('')+
          '</div>'+
        '</div>'
      ).join('')+
    '</div>'+
    '<p class="av-hint">Trascina il token di un\'atleta per cambiare disponibilita\'. Il dato si riflette anche nella pagina Oggi.</p>';
    initAvailDragDrop();
  }

  function initAvailDragDrop(){
    const body = document.getElementById('avail-body');
    if(!body) return;
    body.querySelectorAll('.tok').forEach(tok=>{
      tok.addEventListener('dragstart', e=>{
        draggedName = tok.getAttribute('data-name');
        tok.classList.add('drag');
        if(e.dataTransfer) e.dataTransfer.effectAllowed = 'move';
      });
      tok.addEventListener('dragend', ()=>{ tok.classList.remove('drag'); draggedName = null; });
      tok.addEventListener('keydown', e=>{
        if(e.key !== 'Enter' && e.key !== ' ') return;
        e.preventDefault();
        const nm = tok.getAttribute('data-name');
        const cur = avail[nm] || 'disponibile';
        const idx = AVAIL_STATES.findIndex(s=> s.k===cur);
        const next = AVAIL_STATES[(idx+1) % AVAIL_STATES.length];
        avail[nm] = next.k;
        saveAvail();
        renderAvail();
        toast('Disponibilita\' aggiornata');
      });
    });
    body.querySelectorAll('.av-lane').forEach(lane=>{
      lane.addEventListener('dragover', e=>{ e.preventDefault(); lane.classList.add('over'); });
      lane.addEventListener('dragleave', ()=> lane.classList.remove('over'));
      lane.addEventListener('drop', e=>{
        e.preventDefault(); lane.classList.remove('over');
        if(!draggedName) return;
        const k = lane.getAttribute('data-lane');
        avail[draggedName] = k;
        saveAvail();
        renderAvail();
        toast('Disponibilita\' aggiornata');
      });
    });
  }

  function initAvailToggle(){
    const btn = document.getElementById('avail-toggle');
    const body = document.getElementById('avail-body');
    if(!btn || !body) return;
    btn.addEventListener('click', ()=>{
      const open = btn.getAttribute('aria-expanded') === 'true';
      body.hidden = open;
      btn.textContent = open ? 'Mostra' : 'Nascondi';
      btn.setAttribute('aria-expanded', String(!open));
    });
  }

  // ---------- init ----------
  // popola select ruolo nel form aggiungi
  const addRoleSel = document.getElementById('add-role');
  if(addRoleSel){ ROLES.forEach(r=>{ const o=document.createElement('option'); o.value=r; o.textContent=r; addRoleSel.appendChild(o); }); }

  // btn-add e addrow
  const btnAddEl = document.getElementById('btn-add');
  const addrowEl = document.getElementById('addrow');
  if(btnAddEl) btnAddEl.addEventListener('click', ()=>{
    if(!addrowEl) return;
    const hidden = addrowEl.hidden;
    addrowEl.hidden = !hidden;
    if(!hidden) return;
    const inp = document.getElementById('add-name'); if(inp) inp.focus();
  });
  const addCancelEl = document.getElementById('add-cancel');
  if(addCancelEl) addCancelEl.addEventListener('click', ()=>{
    if(addrowEl) addrowEl.hidden = true;
    const inp = document.getElementById('add-name'); if(inp) inp.value = '';
  });
  const addConfirmEl = document.getElementById('add-confirm');
  if(addConfirmEl) addConfirmEl.addEventListener('click', ()=>{
    const inp = document.getElementById('add-name');
    const rs = document.getElementById('add-role');
    const name = String(inp && inp.value || '').trim();
    if(!name){ if(inp) inp.focus(); toast('Inserisci il nome dell\'atleta'); return; }
    if(PLAYERS.find(p=> p.name===name)){ toast('Atleta gia\' presente'); return; }
    customPlayers[name] = normRole(rs && rs.value || '');
    saveCustom();
    rebuildPlayers();
    if(inp) inp.value = '';
    if(addrowEl) addrowEl.hidden = true;
    renderKPIs(); renderPills(); renderGrid(); renderAvail(); renderSubtitle();
    renderRecon();
    toast('Atleta aggiunta: ' + disp(name));
  });

  // ---------- riconferma atlete dell'anno prima ----------
  // Sulla stagione nuova la rosa arriva dai file: chi non si e' ancora allenata
  // non compare, e sono spesso atlete che ci sono comunque (rientri, chi lavora
  // senza GPS). Qui si rimettono in rosa con un click e con il ruolo dell'anno
  // scorso gia' dentro, senza doverle riscrivere una per una. Rientrano come
  // atlete aggiunte a mano, quindi si tolgono dalla loro scheda come le altre.
  const PLUS_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>';
  const reconEl = document.getElementById('recon');
  const reconListEl = document.getElementById('recon-list');
  const reconNoteEl = document.getElementById('recon-note');

  function reconPool(){
    if(typeof window.fioRosterPrev !== 'function') return [];
    const inRosa = {};
    PLAYERS.forEach(p=>{ inRosa[p.name] = 1; });
    return window.fioRosterPrev().filter(p=> !inRosa[p.name]);
  }

  function renderRecon(){
    if(!reconEl || !reconListEl) return;
    const pool = reconPool();
    if(!pool.length){ reconEl.hidden = true; reconListEl.innerHTML = ''; return; }
    reconEl.hidden = false;
    if(reconNoteEl){
      reconNoteEl.textContent = 'Dalla stagione scorsa, non ancora in rosa quest\'anno: '
        + pool.length + (pool.length===1 ? ' atleta.' : ' atlete.')
        + ' Un click la rimette dentro con il suo ruolo.';
    }
    reconListEl.innerHTML = pool.map(p=>
      '<button type="button" class="recon-btn" data-recon="'+esc(p.name)+'" data-role="'+esc(p.role)+'" title="'+esc(p.name)+'">'
      + PLUS_SVG + esc(disp(p.name))
      + (p.role ? ' <span class="rl">'+esc(p.role)+'</span>' : '')
      + '</button>'
    ).join('');
  }

  if(reconListEl) reconListEl.addEventListener('click', ev=>{
    const b = ev.target.closest('[data-recon]');
    if(!b) return;
    const name = b.getAttribute('data-recon') || '';
    if(!name || PLAYERS.find(p=> p.name===name)) return;
    customPlayers[name] = normRole(b.getAttribute('data-role') || '');
    saveCustom();
    rebuildPlayers();
    renderKPIs(); renderPills(); renderGrid(); renderAvail(); renderSubtitle();
    renderRecon();
    toast('Riconfermata: ' + disp(name));
  });

  renderKPIs(); renderPills(); renderGrid(); updateResetBtn(); buildPrintRoster();
  renderAvail(); initAvailToggle(); renderRecon();
})();
</script>
</body>
</html>
